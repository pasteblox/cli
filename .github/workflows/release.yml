name: Release

# Bump "version" in package.json on main, then:
#   git tag v0.2.0 && git push origin v0.2.0
# Publishes to npm (with provenance) and attaches five standalone binaries + SHA256SUMS
# to a GitHub release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Tag matches package.json and is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "::error::tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1; }

  npm:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      # trusted publishing (OIDC) needs npm 11.5.1 or newer
      - run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Publish unless this version is already on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
          echo "published $name@$version ($tag)" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    name: Binaries
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run build:bin
      - name: Smoke test
        working-directory: dist/bin
        run: ./pbx-linux-x64 --version
      - name: Checksums
        working-directory: dist/bin
        run: |
          test "$(ls pbx-* | wc -l)" = 5
          sha256sum pbx-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pbx-binaries
          path: dist/bin/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [npm, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pbx-binaries
          path: bin
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" bin/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" bin/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $pre
          fi
